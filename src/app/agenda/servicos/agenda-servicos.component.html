<div class="min-h-screen bg-[#F7F5EF] flex" style="font-family: 'DM Sans', sans-serif">
  <app-agenda-sidebar></app-agenda-sidebar>

  <div class="flex-1 flex flex-col min-w-0">
    <ng-container *ngIf="services$ | async as services">
      <header class="bg-white border-b border-[#E8E6DF] px-6 py-4">
        <p class="text-[#85B7EB] text-xs uppercase tracking-[0.18em] font-medium">Profissional</p>
        <h1 class="text-[#042C53] text-xl font-semibold">Serviços</h1>
      </header>

      <main class="flex-1 p-6 overflow-auto">
        <div
          *ngIf="services.length > 0; else emptyServices"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
        >
          <div
            *ngFor="let service of services"
            class="bg-white rounded-2xl border border-[#E8E6DF] p-5"
          >
            <div class="flex items-start justify-between gap-3">
              <p class="text-[#042C53] font-semibold text-sm leading-tight">{{ service.name }}</p>
              <span
                class="text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0"
                [ngClass]="
                  service.active ? 'bg-[#D1FAE5] text-[#065F46]' : 'bg-[#F3F4F6] text-[#6B7280]'
                "
              >
                {{ service.active ? 'Ativo' : 'Inativo' }}
              </span>
            </div>

            <div class="mt-4 flex items-center justify-between">
              <div class="flex items-center gap-1.5 text-[#888780] text-xs">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" />
                  <path
                    d="M12 7v5l3 3"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
                {{ service.durationMinutes }} min
              </div>
              <p class="text-[#042C53] font-bold text-base">{{ formatRevenue(service.price) }}</p>
            </div>
          </div>
        </div>

        <ng-template #emptyServices>
          <div class="flex flex-col items-center justify-center py-20">
            <div
              class="w-14 h-14 rounded-full bg-[#EBF4FD] flex items-center justify-center mb-4"
            >
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"
                  stroke="#185FA5"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <p class="text-[#042C53] font-medium text-sm">Nenhum serviço encontrado</p>
            <p class="text-[#888780] text-xs mt-1">
              Nenhum serviço foi vinculado a este profissional ainda.
            </p>
          </div>
        </ng-template>
      </main>
    </ng-container>
  </div>
</div>
