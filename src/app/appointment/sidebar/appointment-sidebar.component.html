<aside class="hidden lg:flex flex-col w-60 bg-[#042C53] sticky top-0 h-screen p-5">
  <div class="flex items-center gap-3 mb-10">
    <div class="w-8 h-8 rounded-lg bg-[#378ADD] flex items-center justify-center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M8 2v3M16 2v3M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="9" cy="13" r="1.5" fill="white" />
        <circle cx="15" cy="13" r="1.5" fill="white" />
      </svg>
    </div>
    <span class="text-white text-lg font-semibold tracking-tight">Marquei</span>
  </div>

  <nav class="flex-1 space-y-1">
    <a
      routerLink="/appointment"
      routerLinkActive
      #rla0="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [ngClass]="
        rla0.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 2v4M16 2v4M3 10h18M12 14v4M10 16h4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Agendar
    </a>

    <a
      routerLink="/appointment/meus-agendamentos"
      routerLinkActive
      #rla1="routerLinkActive"
      [ngClass]="
        rla1.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2M9 12h6M9 16h4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Meus agendamentos
    </a>
  </nav>

  <div class="border-t border-[#185FA5]/40 pt-4 mt-4">
    <div class="flex items-center gap-3" *ngIf="currentUser">
      <div
        class="w-8 h-8 rounded-full bg-[#378ADD] flex items-center justify-center text-white text-xs font-semibold flex-shrink-0"
      >
        {{ getInitials(currentUser.name) }}
      </div>
      <div class="overflow-hidden">
        <p class="text-white text-sm font-medium truncate">{{ currentUser.name }}</p>
        <button
          type="button"
          (click)="logout()"
          class="text-white text-xs font-medium cursor-pointer"
        >
          Sair
        </button>
      </div>
    </div>
  </div>
</aside>
