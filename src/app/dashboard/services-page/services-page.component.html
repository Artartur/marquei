<div class="min-h-screen bg-[#F7F5EF] flex" style="font-family: 'DM Sans', sans-serif">
  <app-dashboard-sidebar></app-dashboard-sidebar>

  <div class="flex-1 flex flex-col min-w-0">
    <ng-container *ngIf="filteredServices$ | async as services">
      <header class="bg-white border-b border-[#E8E6DF] px-6 py-4 flex items-center justify-between">
        <div>
          <p class="text-[#85B7EB] text-xs uppercase tracking-[0.18em] font-medium">Gerência</p>
          <h1 class="text-[#042C53] text-xl font-semibold">Serviços</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <button
              *ngFor="let opt of filterOptions"
              (click)="setFilter(opt.value)"
              [ngClass]="filter === opt.value
                ? 'bg-[#185FA5] text-white'
                : 'bg-[#F7F5EF] text-[#888780] hover:bg-[#E8E6DF] border border-[#D3D1C7]'"
              class="px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-150"
            >
              {{ opt.label }}
            </button>
          </div>
          <button
            (click)="openCreate()"
            class="bg-[#185FA5] hover:bg-[#0C447C] text-white text-sm font-medium px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round" />
            </svg>
            Novo serviço
          </button>
        </div>
      </header>

      <main class="flex-1 p-6 overflow-auto">
        <div class="bg-white rounded-2xl border border-[#E8E6DF] overflow-hidden">
          <div class="flex items-center justify-between px-6 py-4 border-b border-[#E8E6DF]">
            <h2 class="text-[#042C53] text-sm font-semibold">Serviços cadastrados</h2>
            <span class="text-[#888780] text-xs">{{ services.length }} serviço(s)</span>
          </div>

          <div class="divide-y divide-[#E8E6DF]">
            <div
              *ngFor="let service of services"
              class="flex items-center justify-between px-6 py-4"
            >
              <div class="flex items-center gap-4">
                <button
                  type="button"
                  (click)="toggleActive(service)"
                  [title]="service.active ? 'Desativar' : 'Ativar'"
                  [ngClass]="service.active ? 'bg-[#185FA5]' : 'bg-[#D3D1C7]'"
                  class="relative w-9 h-5 rounded-full transition-all duration-200 flex-shrink-0"
                >
                  <span
                    [ngClass]="service.active ? 'left-5' : 'left-1'"
                    class="absolute top-0.5 w-4 h-4 rounded-full bg-white shadow-sm transition-all duration-200"
                  ></span>
                </button>
                <div>
                  <p class="text-[#2C2C2A] text-sm font-medium">{{ service.name }}</p>
                  <p class="text-[#888780] text-xs mt-0.5">{{ service.durationMinutes }} min</p>
                </div>
              </div>

              <div class="flex items-center gap-6">
                <span class="text-[#185FA5] text-sm font-semibold">
                  R$ {{ service.price | number:'1.2-2' }}
                </span>
                <span
                  [ngClass]="service.active ? 'bg-green-50 text-green-700' : 'bg-[#F7F5EF] text-[#888780]'"
                  class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
                >
                  {{ service.active ? 'Ativo' : 'Inativo' }}
                </span>
                <button
                  (click)="openEdit(service)"
                  class="text-[#888780] hover:text-[#185FA5] transition-colors"
                  title="Editar"
                >
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                    <path
                      d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"
                      stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    />
                  </svg>
                </button>
              </div>
            </div>

            <div
              *ngIf="services.length === 0"
              class="flex flex-col items-center justify-center py-16"
            >
              <div class="w-12 h-12 rounded-2xl bg-[#EBF4FD] flex items-center justify-center mb-4">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"
                    stroke="#185FA5" stroke-width="1.5" stroke-linecap="round"
                  />
                </svg>
              </div>
              <p class="text-[#2C2C2A] text-sm font-medium">Nenhum serviço encontrado</p>
              <p class="text-[#888780] text-xs mt-1">Tente outro filtro ou cadastre um novo serviço.</p>
            </div>
          </div>
        </div>
      </main>
    </ng-container>
  </div>
</div>

<app-service-modal
  [isOpen]="isModalOpen"
  [service]="selectedService"
  (closed)="closeModal()"
  (saved)="onSaved()"
></app-service-modal>
