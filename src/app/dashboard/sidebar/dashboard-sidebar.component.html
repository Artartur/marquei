<aside class="hidden lg:flex flex-col w-60 bg-[#042C53] sticky top-0 h-screen p-5">
  <div class="flex items-center gap-3 mb-10">
    <div class="w-8 h-8 rounded-lg bg-[#378ADD] flex items-center justify-center">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M8 2v3M16 2v3M3 8h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
          stroke="white"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="9" cy="13" r="1.5" fill="white" />
        <circle cx="15" cy="13" r="1.5" fill="white" />
      </svg>
    </div>
    <span class="text-white text-lg font-semibold tracking-tight">Marquei</span>
  </div>

  <nav class="flex-1 space-y-1">
    <a
      routerLink="/dashboard"
      routerLinkActive
      #rla0="routerLinkActive"
      [routerLinkActiveOptions]="{ exact: true }"
      [ngClass]="
        rla0.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.5" />
      </svg>
      Visão geral
    </a>

    <a
      routerLink="/dashboard/agendamentos"
      routerLinkActive
      #rla1="routerLinkActive"
      [ngClass]="
        rla1.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M8 2v4M16 2v4M3 10h18"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Agendamentos
    </a>

    <a
      routerLink="/dashboard/clientes"
      routerLinkActive
      #rla2="routerLinkActive"
      [ngClass]="
        rla2.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Clientes
    </a>

    <a
      routerLink="/dashboard/profissionais"
      routerLinkActive
      #rla3="routerLinkActive"
      [ngClass]="
        rla3.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 11l-3 3-1.5-1.5"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Profissionais
    </a>

    <a
      routerLink="/dashboard/servicos"
      routerLinkActive
      #rla4="routerLinkActive"
      [ngClass]="
        rla4.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
      </svg>
      Serviços
    </a>

    <a
      routerLink="/dashboard/importacao"
      routerLinkActive
      #rla5="routerLinkActive"
      [ngClass]="
        rla5.isActive
          ? 'bg-[#185FA5] text-white'
          : 'text-[#85B7EB] hover:bg-[#0C447C]/60 hover:text-white'
      "
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <path
          d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M7 10l5 5 5-5M12 15V3"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      Importação
    </a>
  </nav>

  <div class="border-t border-[#185FA5]/40 pt-4 mt-4">
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-full bg-[#378ADD] flex items-center justify-center text-white text-xs font-semibold shrink-0"
      ></div>
      <div class="overflow-hidden">
        <p class="text-white text-sm font-medium truncate">{{ currentUser?.name }}</p>
        <button
          type="button"
          (click)="logout()"
          class="text-white text-xs font-medium cursor-pointer"
        >
          Sair
        </button>
      </div>
    </div>
  </div>
</aside>
