<div class="mb-8">
  <h2 class="text-[#042C53] text-3xl font-semibold mb-2" style="font-family: 'DM Sans', sans-serif">
    Crie sua conta
  </h2>
  <p class="text-[#5F5E5A] text-sm">Rápido e gratuito. Seu primeiro agendamento a um clique.</p>
</div>

<form class="space-y-4" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <div>
    <label class="block text-sm font-medium text-[#2C2C2A] mb-1.5">Nome completo</label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM3 21c0-4 4-7 9-7s9 3 9 7"
            stroke="#888780"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>
      </div>
      <input
        type="text"
        formControlName="name"
        placeholder="Seu nome completo"
        class="w-full pl-10 pr-4 py-3 bg-[#F1EFE8] border border-[#D3D1C7] rounded-xl text-[#2C2C2A] text-sm placeholder-[#888780] focus:outline-none focus:ring-2 focus:ring-[#378ADD]/40 focus:border-[#378ADD] transition-all duration-200"
      />
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-[#2C2C2A] mb-1.5">E-mail</label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="4" width="20" height="16" rx="2" stroke="#888780" stroke-width="1.5" />
          <path d="M2 7l10 7 10-7" stroke="#888780" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </div>
      <input
        type="email"
        formControlName="email"
        placeholder="seuemail@exemplo.com"
        class="w-full pl-10 pr-4 py-3 bg-[#F1EFE8] border border-[#D3D1C7] rounded-xl text-[#2C2C2A] text-sm placeholder-[#888780] focus:outline-none focus:ring-2 focus:ring-[#378ADD]/40 focus:border-[#378ADD] transition-all duration-200"
      />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="block text-sm font-medium text-[#2C2C2A] mb-1.5">Telefone</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path
              d="M6.6 10.8a15.6 15.6 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C9.6 21 3 14.4 3 6c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8Z"
              stroke="#888780"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <input
          type="tel"
          formControlName="phone"
          placeholder="(00) 00000-0000"
          class="w-full pl-10 pr-4 py-3 bg-[#F1EFE8] border border-[#D3D1C7] rounded-xl text-[#2C2C2A] text-sm placeholder-[#888780] focus:outline-none focus:ring-2 focus:ring-[#378ADD]/40 focus:border-[#378ADD] transition-all duration-200"
        />
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-[#2C2C2A] mb-1.5">CPF</label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="4" width="18" height="16" rx="2" stroke="#888780" stroke-width="1.5" />
            <path
              d="M7 9h4M7 13h8M7 17h5"
              stroke="#888780"
              stroke-width="1.5"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <input
          type="text"
          formControlName="cpf"
          placeholder="000.000.000-00"
          class="w-full pl-10 pr-4 py-3 bg-[#F1EFE8] border border-[#D3D1C7] rounded-xl text-[#2C2C2A] text-sm placeholder-[#888780] focus:outline-none focus:ring-2 focus:ring-[#378ADD]/40 focus:border-[#378ADD] transition-all duration-200"
        />
      </div>
    </div>
  </div>

  <div>
    <label class="block text-sm font-medium text-[#2C2C2A] mb-1.5">Senha</label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2" stroke="#888780" stroke-width="1.5" />
          <path
            d="M7 11V7a5 5 0 0 1 10 0v4"
            stroke="#888780"
            stroke-width="1.5"
            stroke-linecap="round"
          />
          <circle cx="12" cy="16" r="1.5" fill="#888780" />
        </svg>
      </div>
      <input
        type="password"
        formControlName="password"
        placeholder="Mínimo 8 caracteres"
        class="w-full pl-10 pr-12 py-3 bg-[#F1EFE8] border border-[#D3D1C7] rounded-xl text-[#2C2C2A] text-sm placeholder-[#888780] focus:outline-none focus:ring-2 focus:ring-[#378ADD]/40 focus:border-[#378ADD] transition-all duration-200"
      />
      <button
        type="button"
        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-[#888780] hover:text-[#5F5E5A] transition-colors"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path
            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
        </svg>
      </button>
    </div>
  </div>

  <button
    type="submit"
    class="w-full bg-[#185FA5] hover:bg-[#0C447C] active:bg-[#042C53] text-white font-semibold py-3.5 rounded-xl text-sm transition-all duration-200 shadow-md shadow-[#185FA5]/30 hover:shadow-lg hover:shadow-[#185FA5]/25 flex items-center justify-center gap-2 mt-1"
    [disabled]="isLoading"
  >
    {{ isLoading ? 'Criando conta...' : 'Criar minha conta' }}
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
      <path
        d="M5 12h14M13 6l6 6-6 6"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</form>

<p class="text-xs text-center text-[#888780] mt-6 leading-relaxed">
  Já tem uma conta?
  <button
    (click)="showLogin()"
    class="text-[#185FA5] font-medium hover:text-[#378ADD] transition-colors bg-transparent border-none cursor-pointer p-0"
  >
    Entrar agora
  </button>
</p>
